/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}


</style>
</head>

lle de la polea",g:"transmision",s:"Cierra la polea conducida",w:"Empuja las mitades de la polea conducida para cerrarlas.",h:"Al arrancar, el muelle gana y la polea queda cerrada (marcha corta). A m\xE1s velocidad, la correa lo vence y lo comprime.",x:"Su dureza decide cu\xE1ndo sube la marcha.",rel:["conducida"],vec:[0,-.08,.38],cam:{az:10,el:8}},correa:{n:"Correa de transmisi\xF3n",g:"transmision",s:"Une las dos poleas",w:"Una correa que transmite el giro de la polea motriz a la conducida.",h:"Va apretada entre las dos mitades de cada polea. Si cambian sus di\xE1metros, la correa sube o baja por ellas y cambia la relaci\xF3n.",x:"Si se desgasta o resbala, la moto pierde fuerza: es una pieza de mantenimiento.",rel:["motriz","conducida","cubierta-correa"],vec:[0,0,.26],cam:{az:10,el:8}},embrague:{n:"Embrague centr\xEDfugo",g:"transmision",s:"Conecta el motor con la rueda",w:"Desconecta el motor de la rueda al ralent\xED y lo conecta al acelerar. Permite arrancar sin accionar ning\xFAn mando.",h:"Unas zapatas giran con el motor. Al pasar de cierto r\xE9gimen, la fuerza centr\xEDfuga las empuja contra una campana y esta arrastra la rueda.",x:"En la maqueta se acopla entre 2800 y 3300 vueltas (valor estimado).",rel:["conducida","engranajes"],vec:[0,-.2,.3],cam:{az:10,el:8}},engranajes:{n:"Reducci\xF3n final",g:"transmision",s:"Dos pares de engranajes",w:"Dos pares de engranajes que bajan las vueltas hasta la rueda trasera.",h:"Reducen las vueltas unas 22 veces (valor estimado de la maqueta) y multiplican la fuerza. As\xED el peque\xF1o motor puede mover la moto.",x:"Los dientes est\xE1n calculados con los datos de la maqueta: 14:56 y 12:66.",rel:["embrague","rueda-t-tambor"],vec:[0,-.18,.22],cam:{az:10,el:8}},"cubierta-correa":{n:"Cubierta de la correa",g:"transmision",s:"La caja gris de aluminio",w:"La caja gris de aluminio que protege la correa y las poleas.",h:"Evita que entren suciedad y agua y que el conductor toque piezas en movimiento. Sus rejillas dejan pasar aire para refrigerar.",x:"Se ve en la moto real: es la gran caja gris junto a la rueda trasera.",rel:["correa","motriz"],vec:[0,0,.6],cam:{az:10,el:8}},escape:{n:"Tubo de escape",g:"otros",s:"Saca los gases quemados",w:"Saca los gases quemados y reduce el ruido del motor.",h:"En un dos tiempos el escape tambi\xE9n ayuda a llenar el cilindro: la onda de presi\xF3n devuelve parte de la mezcla fresca antes de que cierre la lumbrera.",x:"Por eso su forma y su longitud influyen mucho en la potencia.",rel:["cilindro"],vec:[0,-.12,.42],cam:{az:10,el:6}},amortiguador:{n:"Amortiguadores traseros",g:"otros",s:"Absorben los baches",w:"Absorben los baches de la rueda trasera para que el asiento sea c\xF3modo.",h:"Un muelle se comprime con el bache y un amortiguador hidr\xE1ulico frena el rebote para que la moto no bote.",x:"Hay uno a cada lado de la rueda.",rel:["guardabarros-t","rueda-t-llanta"],vec:[0,.22,.3],mirror:!0,cam:{az:15,el:10}},pedales:{n:"Pedales",g:"otros",s:"Arrancan y ayudan",w:"Sirven para arrancar el motor y para ayudar en cuestas o si te quedas sin gasolina.",h:"Hacen girar el motor con una transmisi\xF3n mec\xE1nica. Al pedalear con el motor parado, el cig\xFCe\xF1al gira y arranca.",x:"Es herencia de las bicicletas con motor: el Vespino es un ciclomotor.",rel:["ciguenal","caballete"],vec:[.08,-.04,.28],mirror:!0,cam:{az:20,el:12}},caballete:{n:"Caballete central",g:"otros",s:"Sostiene la moto aparcada",w:"Sostiene la moto en vertical cuando se aparca.",h:"Se apoya en el suelo con dos patas. Al tirar de la moto hacia atr\xE1s, su peso sube sobre el caballete.",x:"Con la moto en el caballete, la rueda trasera queda en el aire.",rel:["pedales"],vec:[0,0,.32],mirror:!0,cam:{az:12,el:6}},...Od("t","trasera",!1),...Od("d","delantera",!0)},hn=Object.keys(Zt);var Mh={vespino:[{y:"1967",t:"Una crisis y una patente",p:"La crisis econ\xF3mica de 1967 empuja a Moto Vespa a buscar un ciclomotor barato. El dise\xF1o es del ingeniero salmantino Vicente Carranza y se patenta ese a\xF1o.",f:["Dise\xF1o: Vicente Carranza","Objetivo: bajo coste"]},{y:"1968",t:"Empieza la fabricaci\xF3n",p:"El Vespino se fabrica entero en Madrid, en el pol\xEDgono de la calle Juli\xE1n Camarillo. Lleva un motor de dos tiempos de 49,77 cm\xB3 (38,4 \xD7 43 mm) con variador de correa.",f:["Cilindrada: 49,77 cm\xB3","F\xE1brica: Madrid"]},{y:"1969\u20131972",t:"Llega la familia",p:"Aparecen el N, el Tour, el Lujo, el Brisa y el Rally. El Brisa, m\xE1s sencillo, se pens\xF3 para exportar; el Rally lleva un dep\xF3sito de 6,5 litros, casi el doble del normal.",f:["Lujo: encendido electr\xF3nico","Rally: dep\xF3sito de 6,5 L"]},{y:"1973",t:"Series T y L",p:"Llega la serie T, con horquilla telesc\xF3pica y llantas de 16 pulgadas, y la serie L y GL, con el faro cuadrado.",f:["T: horquilla telesc\xF3pica","L: faro cuadrado"]},{y:"1978\u20131980",t:"NL y SC",p:"El NL elimina la tapa basculante de la carrocer\xEDa. En 1980 llegan el SC y el SCA, con llantas de aleaci\xF3n.",f:["NL: sin tapa basculante","SCA: llantas de aleaci\xF3n"]},{y:"1985\u20131988",t:"Nuevo chasis y arranque el\xE9ctrico",p:"El AL (1985) estrena chasis y admisi\xF3n por l\xE1minas. El ALX (1986) pasa a 12 voltios y el XE (1988) incorpora arranque el\xE9ctrico.",f:["AL: admisi\xF3n por l\xE1minas","XE: arranque el\xE9ctrico"]},{y:"1990\u20131999",t:"Los a\xF1os 90",p:"Llegan el New Look, el F9, el Fast Rider y el Velofax. Desde 1994 salen series especiales para Telepizza.",f:["Series Telepizza: 1994\u20132000"]},{y:"2000",t:"Fin de la producci\xF3n",p:"La f\xE1brica de Madrid cierra tras la deslocalizaci\xF3n de Piaggio. El \xFAltimo modelo fabricado es una edici\xF3n para Telepizza. En total se hicieron cerca de 1,8 millones de unidades.",f:["\u2248 1,8 millones de unidades"]},{y:"Hoy",t:"Un icono de los a\xF1os 70",p:"Se le considera un icono cultural, junto al Seat 600. Cada a\xF1o hay quedadas de aficionados, y en 2018 se celebraron los 50 a\xF1os con una placa en el antiguo emplazamiento de la f\xE1brica.",f:["Quedadas en toda Espa\xF1a"]},{y:"Datos",t:"El original en cifras",p:"El motor original daba unos 2,2 CV a 4.700 vueltas. El consumo homologado era de 1,6 litros cada 100 km, con la mezcla de gasolina y aceite al 2 %. Casi todos los modelos llevaban pedales.",f:["2,2 CV a 4.700 rpm","1,6 L / 100 km"]}],marca:[{y:"1884",t:"Nace Piaggio",p:"Rinaldo Piaggio funda en Sestri Ponente, cerca de G\xE9nova, una empresa que empieza fabricando acabados para barcos.",f:["Italia \xB7 G\xE9nova"]},{y:"1946",t:"Nace la Vespa",p:"Piaggio presenta la Vespa, dise\xF1ada por el ingeniero Corradino D\u2019Ascanio. Su nombre, \xABavispa\xBB en italiano, viene de la forma del cuerpo y del zumbido del motor.",f:["Dise\xF1o: Corradino D\u2019Ascanio"]},{y:"1951\u20131952",t:"Moto Vespa S.A.",p:"Enrico Piaggio crea en Espa\xF1a Moto Vespa S.A., con capital del Banco Urquijo y del INI. En 1952 la filial se instala en Madrid.",f:["Socios: Piaggio, Banco Urquijo, INI"]},{y:"1968",t:"Un ciclomotor espa\xF1ol",p:"Moto Vespa empieza a fabricar el Vespino. Se exporta pronto a Francia, Reino Unido, Alemania, Marruecos, Colombia y Chile. En Sudam\xE9rica lleva un motor de 65 cm\xB3.",f:["Exportado a 6 pa\xEDses pioneros"]},{y:"1996",t:"Piaggio Espa\xF1a",p:"Piaggio toma el control total de la filial y Moto Vespa S.A. pasa a llamarse Piaggio Espa\xF1a S.A.",f:["Fin del nombre Moto Vespa"]},{y:"2000",t:"Cierra la f\xE1brica de Madrid",p:"La deslocalizaci\xF3n de Piaggio provoca el cierre de la f\xE1brica de Madrid y el fin de la producci\xF3n del Vespino.",f:["\xDAltima unidad: edici\xF3n Telepizza"]},{y:"2018",t:"50 a\xF1os del Vespino",p:"Se celebra el 50 aniversario del ciclomotor en Madrid, con una placa en el antiguo emplazamiento de la f\xE1brica.",f:["Placa en Juli\xE1n Camarillo"]}]},Bd="Fuentes: Wikipedia (Motovespa Vespino), vespinos.org y Motorpasi\xF3n Moto. Algunas fechas var\xEDan seg\xFAn la fuente.";var Sh=[{t:"Visi\xF3n general",s:"Un motor sin v\xE1lvulas",p:"El Vespino lleva un motor de dos tiempos: en solo dos carreras del pist\xF3n, una subida y una bajada, hace todo el ciclo. Por eso da una explosi\xF3n en cada vuelta del cig\xFCe\xF1al, el doble que un cuatro tiempos. Sin v\xE1lvulas ni \xE1rbol de levas, es sencillo, ligero y barato.",f:["Cilindrada: 49,77 cm\xB3 (38,4 \xD7 43 mm)","Refrigerado por aire","Un cilindro"],view:"engine"},{t:"Admisi\xF3n y compresi\xF3n",s:"El pist\xF3n sube",p:"Al subir, el pist\xF3n tapa las lumbreras del cilindro y comprime la mezcla que hay encima. A la vez, debajo se crea un vac\xEDo en el c\xE1rter que aspira mezcla nueva de gasolina, aceite y aire desde el carburador. Una sola carrera hace dos trabajos.",f:["Arriba: se comprime","Abajo: entra mezcla nueva"],th:[200,345],view:"engine"},{t:"Chispa y explosi\xF3n",s:"La carrera que empuja",p:"Cuando el pist\xF3n llega arriba, la buj\xEDa salta una chispa y la mezcla comprimida arde. La presi\xF3n empuja el pist\xF3n hacia abajo, y esa es la \xFAnica carrera que da fuerza. La biela convierte el empuje en giro del cig\xFCe\xF1al.",f:["Una explosi\xF3n por vuelta","A 3000 rpm son 50 por segundo"],th:[340,460],view:"engine"},{t:"Escape y barrido",s:"Salen los gases y entra mezcla",p:"Al bajar, el pist\xF3n destapa primero la lumbrera de escape y los gases quemados salen. Despu\xE9s destapa las de transferencia: la mezcla nueva, comprimida por debajo, sube desde el c\xE1rter, empuja lo que queda de gas quemado y llena el cilindro. A eso se le llama barrido.",f:["El escape se abre antes","Parte de la mezcla nueva se escapa"],th:[95,250],view:"engine"},{t:"El c\xE1rter es una bomba",s:"Por qu\xE9 va cerrado",p:"En un dos tiempos el c\xE1rter no guarda aceite: trabaja como bomba. El pist\xF3n, al subir y bajar, aspira y comprime la mezcla por debajo. Por eso debe cerrar sin ninguna fuga.",f:["C\xE1rter estanco","Retenes a ambos lados"],th:[20,200],view:"engine"},{t:"Lubricaci\xF3n por mezcla",s:"El aceite viaja en la gasolina",p:"Como el c\xE1rter no tiene aceite, se lubrica el motor mezclando aceite con la gasolina. Con el aceite al 2 %, el consumo homologado del Vespino era de 1,6 litros cada 100 km. La mezcla pasa por cojinetes, biela y cilindro y se quema con el resto, por eso el humo huele a aceite.",f:["Mezcla al 2 %","1,6 L / 100 km"],view:"engine"},{t:"Encendido",s:"La chispa a tiempo",p:"El volante magn\xE9tico gira con el cig\xFCe\xF1al y genera la electricidad. Una bobina la eleva a miles de voltios, y la buj\xEDa salta la chispa un poco antes de que el pist\xF3n llegue arriba. Ese adelanto es lo que se llama avance del encendido.",f:["Volante magn\xE9tico","Bobina y buj\xEDa"],view:"engine"},{t:"Variador y embrague",s:"La marcha autom\xE1tica",p:"Dos poleas con correa forman el variador. Al subir de vueltas, las masas centr\xEDfugas juntan las caras de la polea motriz y la correa cambia de radio, como una marcha que cambia sola. El embrague centr\xEDfugo une el motor a la rueda solo por encima de unas 3000 rpm.",f:["Sin palanca de cambios","Embrague centr\xEDfugo","Reducci\xF3n final 22 : 1"],view:"drive"},{t:"Dos tiempos frente a cuatro",s:"Dos formas de hacer el mismo trabajo",p:"Un cuatro tiempos necesita dos vueltas del cig\xFCe\xF1al por explosi\xF3n y usa v\xE1lvulas y un c\xE1rter con aceite. Un dos tiempos explota en cada vuelta, es m\xE1s sencillo y ligero, pero gasta m\xE1s y contamina m\xE1s.",f:["Dos tiempos: 1 explosi\xF3n cada vuelta","Cuatro tiempos: 1 explosi\xF3n cada 2 vueltas","Dos tiempos: sin v\xE1lvulas; aceite en la gasolina","Cuatro tiempos: v\xE1lvulas, \xE1rbol de levas y aceite en el c\xE1rter","El Vespino es de dos tiempos"],view:"engine"}];var Eh=[["Verde","#86c872"],["Rojo","#d5473d"],["Azul","#4a86c9"],["Amarillo","#e7c33f"],["Naranja","#e8873a"],["Blanco","#eceeea"],["Negro","#3a3d40"]],wh=[{t:"No arranca: no hay chispa",s:"El motor gira pero no se enciende",view:"engine",parts:["bujia","volante"],inside:!0,secs:[["S\xEDntoma","Das pedal o patada y el motor no da ni una explosi\xF3n. Huele a gasolina."],["Causa probable","Buj\xEDa sucia, mojada o gastada; pipa de la buj\xEDa floja; o fallo en la bobina del volante magn\xE9tico."],["C\xF3mo se revisa","Saca la buj\xEDa, ap\xF3yala en una parte met\xE1lica del motor y gira el motor: debe saltar una chispa azulada. Mira si el electrodo est\xE1 negro o h\xFAmedo."],["Soluci\xF3n","Limpiar o cambiar la buj\xEDa. Si sigue sin chispa, revisar cables y bobina en un taller."]]},{t:"No arranca: no llega gasolina",s:"Hay chispa, pero no hay mezcla",view:"engine",parts:["deposito","filtro","carburador"],inside:!1,secs:[["S\xEDntoma","Hay chispa pero el motor no coge. No huele a gasolina o el dep\xF3sito est\xE1 vac\xEDo."],["Causa probable","Dep\xF3sito vac\xEDo, grifo cerrado, filtro atascado o chicl\xE9 del carburador obstruido."],["C\xF3mo se revisa","Comprueba el nivel y el grifo, afloja con cuidado la manguera del carburador y mira si fluye gasolina."],["Soluci\xF3n","Rellenar, abrir el grifo, limpiar el filtro y desmontar y limpiar el carburador con limpiador espec\xEDfico."]]},{t:"Ralent\xED inestable o se cala",s:"Arranca y se apaga al soltar el acelerador",view:"engine",parts:["carburador","filtro"],inside:!1,secs:[["S\xEDntoma","Con el acelerador suelto el motor tiembla, sube y baja de vueltas o se apaga."],["Causa probable","Carburador sucio, ralent\xED mal regulado o entrada de aire por una junta agrietada."],["C\xF3mo se revisa","Mira el estado de las juntas de la admisi\xF3n y regula el tornillo de ralent\xED del carburador."],["Soluci\xF3n","Limpiar y regular el carburador y cambiar las juntas da\xF1adas."]]},{t:"Humo azul o blanco",s:"Sale mucho humo por el escape",view:"engine",parts:["piston","cilindro","escape"],inside:!0,secs:[["S\xEDntoma","Una nube de humo azulado y olor a aceite quemado, sobre todo al acelerar."],["Causa probable","Demasiado aceite en la mezcla, o segmentos y cilindro gastados que dejan pasar aceite."],["C\xF3mo se revisa","Comprueba la proporci\xF3n de la mezcla (el consumo se calcula con un 2 %) y mira el aspecto del pist\xF3n y del cilindro."],["Soluci\xF3n","Preparar bien la mezcla; si el desgaste es grande, cambiar segmentos o el kit de cilindro y pist\xF3n."]]},{t:"Pierde potencia",s:"No sube de vueltas ni en las cuestas",view:"engine",parts:["escape","piston","filtro"],inside:!1,secs:[["S\xEDntoma","La moto va floja, le cuesta acelerar y no llega a su velocidad habitual."],["Causa probable","Escape obstruido por carbonilla, segmentos gastados o filtro de aire sucio."],["C\xF3mo se revisa","Limpia el filtro, mira si el escape est\xE1 atascado de carbonilla y comprueba la compresi\xF3n del cilindro."],["Soluci\xF3n","Descarbonizar o cambiar el escape, limpiar el filtro y cambiar los segmentos si hace falta."]]},{t:"Acelera pero no avanza",s:"El motor sube de vueltas y la moto patina",view:"drive",parts:["correa","embrague","motriz","conducida"],inside:!0,secs:[["S\xEDntoma","El motor sube de vueltas pero la rueda trasera apenas recibe fuerza, o hay olor a goma."],["Causa probable","Correa gastada o aceitosa, zapatas del embrague gastadas, o masas del variador desgastadas."],["C\xF3mo se revisa","Abre la cubierta del variador y mira la correa (grietas, ancho) y el estado de las zapatas del embrague."],["Soluci\xF3n","Cambiar la correa y las piezas gastadas del variador y del embrague, siempre en juego."]]},{t:"Golpeteo met\xE1lico",s:"Un ruido seco que sube con las vueltas",view:"engine",parts:["biela","piston","ciguenal"],inside:!0,secs:[["S\xEDntoma","Un golpeteo met\xE1lico dentro del motor que crece con las vueltas."],["Causa probable","Holgura en la biela o en el cig\xFCe\xF1al, o un pist\xF3n demasiado gastado."],["C\xF3mo se revisa","Es una aver\xEDa interna: con el motor parado se busca holgura moviendo el pist\xF3n; lo dem\xE1s exige abrir el motor."],["Soluci\xF3n","Parar el motor y llevarlo a un taller: seguir circulando puede destrozarlo."]]},{t:"El motor se agarrota",s:"Se queda bloqueado de golpe",view:"engine",parts:["piston","cilindro","culata"],inside:!0,secs:[["S\xEDntoma","El motor pierde fuerza, se calienta y se bloquea de repente."],["Causa probable","Falta de aceite en la mezcla, mezcla demasiado pobre o sobrecalentamiento."],["C\xF3mo se revisa","Al abrirlo se ven marcas de rozamiento en el pist\xF3n y las paredes del cilindro."],["Soluci\xF3n","Reparar el cilindro y el pist\xF3n y revisar la mezcla. Es mejor prevenirlo usando siempre la mezcla correcta."]]},{t:"Frenos flojos",s:"Hay que apretar mucho para parar",view:"side",parts:["rueda-t-tambor","rueda-d-tambor"],inside:!1,secs:[["S\xEDntoma","La palanca llega casi al final y la moto frena poco o tarda en parar."],["Causa probable","Zapatas gastadas, cable destensado o tambor con grasa."],["C\xF3mo se revisa","Mira el desgaste de las zapatas del tambor y la holgura del cable."],["Soluci\xF3n","Tensar el cable, limpiar el tambor y cambiar las zapatas."]]}],Cl=[{y:"1968\u20131969",t:"Vespino",s:"El original",p:"El primero, con faro redondo, de 1968. Nace de una patente de 1967 y es el punto de partida de toda la familia.",f:["Motor de dos tiempos de 49 cc","Variador de correa","Faro redondo"]},{y:"1969\u20131970",t:"N",s:"El \xABnormal\xBB",p:"Se llam\xF3 N para distinguirlo del Tour y del Lujo. Cambia poco: no lleva logo en los pu\xF1os y el amortiguador trasero no se engrasa.",f:["Sin logo en los pu\xF1os","Amortiguador sin engrasador"]},{y:"1969\u20131971",t:"Tour",s:"Con cromados",p:"A\xF1ade cromados y un piloto trasero situado m\xE1s bajo.",f:["Cromados","Piloto trasero bajo"]},{y:"1969\u20131972",t:"Lujo",s:"El m\xE1s equipado",p:"Incorpora encendido electr\xF3nico, cromados en la horquilla y en el amortiguador y un sill\xEDn corrido. El Lujo de 1969 tiene faro rectangular.",f:["Encendido electr\xF3nico","Sill\xEDn corrido","Faro rectangular (1969)"]},{y:"1970\u20131972",t:"Brisa",s:"El sencillo",p:"Una versi\xF3n sencilla, preferida para exportar, con horquilla de brazos oscilant #app{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:${We.ink};-webkit-font-smoothing:antialiased}
.ui{position:absolute;inset:0;pointer-events:none}
.pn{position:absolute;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(247,250,248,.92));border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:0 12px 36px rgba(20,44,30,.16),0 1px 2px rgba(20,44,30,.1),inset 0 1px 0 #fff}
.eb{position:absolute;font-size:10.5px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;color:${We.mute};white-space:nowrap}
.eb::before{content:'';display:inline-block;width:11px;height:2px;border-radius:1px;background:${We.acc};margin-right:7px;vertical-align:middle;position:relative;top:-1px}
.tx{position:absolute;font-size:13.5px;line-height:1.45;color:#38433d}
.tb{position:absolute;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border-radius:11px;border:1px solid ${We.line};background:#fff;color:${We.ink};white-space:nowrap;box-sizing:border-box;cursor:pointer;pointer-events:auto;box-shadow:0 1px 2px rgba(20,44,30,.06);transition:background .15s,color .15s,border-color .15s,box-shadow .15s,transform .15s}
.tb:hover{border-color:#b9d9c4;box-shadow:0 3px 10px rgba(30,100,60,.16);transform:translateY(-1px)}
.tb.on{background:linear-gradient(180deg,#3cae5c,${We.acc});border-color:${We.accDark};color:#fff;box-shadow:0 3px 10px rgba(30,120,60,.34)}
.tb kbd{position:absolute;right:7px;top:50%;transform:translateY(-50%);font:600 9.5px "Segoe UI",sans-serif;color:${We.mute};background:#eef2ef;border-radius:5px;padding:1px 5px}
.tb.on kbd{background:rgba(255,255,255,.25);color:#fff}
.tb.dark{background:linear-gradient(180deg,#26342c,${We.ink});border-color:${We.ink};color:#fff}
.dv{position:absolute;height:1px;background:${We.line}}
.call{position:absolute;box-sizing:border-box;padding:6px 11px 7px;background:rgba(255,255,255,.95);border-radius:11px;box-shadow:0 5px 16px rgba(20,44,30,.22);white-space:nowrap}
.call b{display:block;font-size:13px;font-weight:700}
.call span{display:block;font-size:11.5px;color:${We.mute};margin-top:1px}
.cur{position:absolute;left:0;top:0;z-index:50;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.ring{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid ${We.acc};opacity:0;z-index:49}
.logo{position:absolute;height:92px;width:248px;border-radius:15px;background:radial-gradient(120% 140% at 30% 10%,#a8e093 0%,#7ec26a 45%,#4f9f46 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -12px 24px rgba(30,80,30,.3),0 6px 16px rgba(40,90,40,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.logo i{font-style:italic;font-weight:700;font-size:50px;line-height:1;font-family:"Segoe Script","Brush Script MT","Lucida Handwriting",cursive;color:#f4f6f8;text-shadow:1px 1px 0 #3f444b,-1px -1px 0 #3f444b,1px -1px 0 #3f444b,-1px 1px 0 #3f444b,0 4px 7px rgba(20,40,20,.4)}
.logo u{text-decoration:none;font-size:9.5px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.92);margin-top:6px}
.seg{position:absolute;height:38px;border-radius:13px;background:#e9efeb;box-shadow:inset 0 1px 3px rgba(20,44,30,.12)}
.plist{position:absolute;overflow-y:auto;pointer-events:auto;padding-right:4px;box-sizing:border-box}
.plist::-webkit-scrollbar{width:6px}
.plist::-webkit-scrollbar-thumb{background:#c7d3cb;border-radius:3px}
.pg{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${We.mute};padding:10px 6px 4px}
.pi{display:flex;align-items:center;gap:9px;height:29px;padding:0 8px;border-radius:9px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.pi:hover{background:#eef6f0}
.pi.sel{background:${We.accSoft};font-weight:700;color:${We.accDark}}
.pi span{overflow:hidden;text-overflow:ellipsis}
.opt{display:block;margin:0 0 8px;padding:10px 12px;border-radius:11px;background:#eef2ef;font-size:13.5px;font-weight:600;cursor:pointer;pointer-events:auto;border:1.5px solid transparent;transition:background .15s}
.opt:hover{background:${We.accSoft}}
.opt.ok{background:#d9f2e0;border-color:${We.acc};color:${We.accDark}}
.opt.bad{background:#fbe3df;border-color:#e0705f;color:#a3392a}
.opt.go{background:linear-gradient(180deg,#3cae5c,${We.acc});color:#fff;text-align:center}
.sw{position:absolute;width:28px;height:28px;border-radius:50%;cursor:pointer;pointer-events:auto;box-shadow:inset 0 -3px 5px rgba(0,0,0,.18),0 2px 5px rgba(20,44,30,.25);border:2px solid #fff;box-sizing:border-box}
.sw.on{outline:2.5px solid ${We.acc};outline-offset:1px}
.pi b{flex:none;min-width:66px;font-size:11.5px;color:${We.accDark}}
.yr{margin:12px 0 0;font-size:46px;line-height:1;font-weight:700;color:${We.acc};letter-spacing:-1px}
.fl{margin:0;padding:0;list-style:none}
.fl li{position:relative;padding:3px 0 3px 16px;font-size:13.5px;color:#35403a}
.fl li:before{content:'';position:absolute;left:2px;top:11px;width:6px;height:6px;border-radius:50%;background:${We.acc}}
.src{font-size:10.5px;color:${We.mute};line-height:1.4}
.pi i{display:block;width:7px;height:7px;border-radius:50%;background:${We.faint};flex:none}
.pi.sel i{background:${We.acc}}
.pi em{margin-left:auto;font-style:normal;font-size:10px;font-weight:600;color:${We.orange}}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:${We.accDark};background:${We.accSoft};border-radius:8px;padding:4px 9px}
.pc h2{margin:10px 0 2px;font-size:27px;line-height:1.12;font-weight:700}
.pc .sub{margin:0 0 6px;font-size:13px;color:${We.mute};font-style:italic}
.pc h4{margin:18px 0 4px;font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:${We.accDark}}
.pc p{margin:0;font-size:14px;line-height:1.5;color:#35403a}
.chip{display:inline-block;margin:0 5px 6px 0;padding:5px 10px;border-radius:999px;background:#eef2ef;font-size:12px;font-weight:600;cursor:pointer;pointer-events:auto;transition:background .15s}
.chip:hover{background:${We.accSoft};color:${We.accDark}}
.tip{position:absolute;z-index:40;padding:5px 10px;border-radius:9px;background:${We.ink};color:#fff;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);display:none}

html,body{background:#dfe2dd;overflow:hidden}
#app{position:absolute!important;inset:auto!important;left:0;top:0;width:${os}px;height:${Ta}px;transform-origin:0 0}
#gl{touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
.tb{pointer-events:auto;cursor:pointer}
.tb:hover{filter:brightness(.95)}
.hit{position:absolute;pointer-events:auto;cursor:pointer}
.hit.ew{cursor:ew-resize}
.tourchip{position:absolute;left:800px;top:60px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;height:28px;padding:0 14px;border-radius:14px;border:1px solid #e3e8e4;background:rgba(255,255,255,.94);box-shadow:0 4px 14px rgba(20,30,24,.14);color:#16181b;font:600 12px 'Segoe UI',system-ui,sans-serif;letter-spacing:.3px;white-space:nowrap;cursor:pointer;pointer-events:auto}
.tourchip i{display:block;width:6px;height:6px;border-radius:50%;background:#3c9a3f}
.tourchip.on i{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
