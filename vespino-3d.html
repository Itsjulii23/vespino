/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}


</style>
</head>

 original en cifras",p:"El motor original daba unos 2,2 CV a 4.700 vueltas. El consumo homologado era de 1,6 litros cada 100 km, con la mezcla de gasolina y aceite al 2 %. Casi todos los modelos llevaban pedales.",f:["2,2 CV a 4.700 rpm","1,6 L / 100 km"]}],marca:[{y:"1884",t:"Nace Piaggio",p:"Rinaldo Piaggio funda en Sestri Ponente, cerca de G\xE9nova, una empresa que empieza fabricando acabados para barcos.",f:["Italia \xB7 G\xE9nova"]},{y:"1946",t:"Nace la Vespa",p:"Piaggio presenta la Vespa, dise\xF1ada por el ingeniero Corradino D\u2019Ascanio. Su nombre, \xABavispa\xBB en italiano, viene de la forma del cuerpo y del zumbido del motor.",f:["Dise\xF1o: Corradino D\u2019Ascanio"]},{y:"1951\u20131952",t:"Moto Vespa S.A.",p:"Enrico Piaggio crea en Espa\xF1a Moto Vespa S.A., con capital del Banco Urquijo y del INI. En 1952 la filial se instala en Madrid.",f:["Socios: Piaggio, Banco Urquijo, INI"]},{y:"1968",t:"Un ciclomotor espa\xF1ol",p:"Moto Vespa empieza a fabricar el Vespino. Se exporta pronto a Francia, Reino Unido, Alemania, Marruecos, Colombia y Chile. En Sudam\xE9rica lleva un motor de 65 cm\xB3.",f:["Exportado a 6 pa\xEDses pioneros"]},{y:"1996",t:"Piaggio Espa\xF1a",p:"Piaggio toma el control total de la filial y Moto Vespa S.A. pasa a llamarse Piaggio Espa\xF1a S.A.",f:["Fin del nombre Moto Vespa"]},{y:"2000",t:"Cierra la f\xE1brica de Madrid",p:"La deslocalizaci\xF3n de Piaggio provoca el cierre de la f\xE1brica de Madrid y el fin de la producci\xF3n del Vespino.",f:["\xDAltima unidad: edici\xF3n Telepizza"]},{y:"2018",t:"50 a\xF1os del Vespino",p:"Se celebra el 50 aniversario del ciclomotor en Madrid, con una placa en el antiguo emplazamiento de la f\xE1brica.",f:["Placa en Juli\xE1n Camarillo"]}]},Dd="Fuentes: Wikipedia (Motovespa Vespino), vespinos.org y Motorpasi\xF3n Moto. Algunas fechas var\xEDan seg\xFAn la fuente.";var ya=[{t:"Visi\xF3n general",s:"Un motor sin v\xE1lvulas",p:"El Vespino lleva un motor de dos tiempos: en solo dos carreras del pis #app{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:${Ye.ink};-webkit-font-smoothing:antialiased}
.ui{position:absolute;inset:0;pointer-events:none}
.pn{position:absolute;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(247,250,248,.92));border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:0 12px 36px rgba(20,44,30,.16),0 1px 2px rgba(20,44,30,.1),inset 0 1px 0 #fff}
.eb{position:absolute;font-size:10.5px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;color:${Ye.mute};white-space:nowrap}
.eb::before{content:'';display:inline-block;width:11px;height:2px;border-radius:1px;background:${Ye.acc};margin-right:7px;vertical-align:middle;position:relative;top:-1px}
.tx{position:absolute;font-size:13.5px;line-height:1.45;color:#38433d}
.tb{position:absolute;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border-radius:11px;border:1px solid ${Ye.line};background:#fff;color:${Ye.ink};white-space:nowrap;box-sizing:border-box;cursor:pointer;pointer-events:auto;box-shadow:0 1px 2px rgba(20,44,30,.06);transition:background .15s,color .15s,border-color .15s,box-shadow .15s,transform .15s}
.tb:hover{border-color:#b9d9c4;box-shadow:0 3px 10px rgba(30,100,60,.16);transform:translateY(-1px)}
.tb.on{background:linear-gradient(180deg,#3cae5c,${Ye.acc});border-color:${Ye.accDark};color:#fff;box-shadow:0 3px 10px rgba(30,120,60,.34)}
.tb kbd{position:absolute;right:7px;top:50%;transform:translateY(-50%);font:600 9.5px "Segoe UI",sans-serif;color:${Ye.mute};background:#eef2ef;border-radius:5px;padding:1px 5px}
.tb.on kbd{background:rgba(255,255,255,.25);color:#fff}
.tb.dark{background:linear-gradient(180deg,#26342c,${Ye.ink});border-color:${Ye.ink};color:#fff}
.dv{position:absolute;height:1px;background:${Ye.line}}
.call{position:absolute;box-sizing:border-box;padding:6px 11px 7px;background:rgba(255,255,255,.95);border-radius:11px;box-shadow:0 5px 16px rgba(20,44,30,.22);white-space:nowrap}
.call b{display:block;font-size:13px;font-weight:700}
.call span{display:block;font-size:11.5px;color:${Ye.mute};margin-top:1px}
.cur{position:absolute;left:0;top:0;z-index:50;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.ring{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid ${Ye.acc};opacity:0;z-index:49}
.logo{position:absolute;height:92px;width:248px;border-radius:15px;background:radial-gradient(120% 140% at 30% 10%,#a8e093 0%,#7ec26a 45%,#4f9f46 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -12px 24px rgba(30,80,30,.3),0 6px 16px rgba(40,90,40,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.logo i{font-style:italic;font-weight:700;font-size:50px;line-height:1;font-family:"Segoe Script","Brush Script MT","Lucida Handwriting",cursive;color:#f4f6f8;text-shadow:1px 1px 0 #3f444b,-1px -1px 0 #3f444b,1px -1px 0 #3f444b,-1px 1px 0 #3f444b,0 4px 7px rgba(20,40,20,.4)}
.logo u{text-decoration:none;font-size:9.5px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.92);margin-top:6px}
.seg{position:absolute;height:38px;border-radius:13px;background:#e9efeb;box-shadow:inset 0 1px 3px rgba(20,44,30,.12)}
.plist{position:absolute;overflow-y:auto;pointer-events:auto;padding-right:4px;box-sizing:border-box}
.plist::-webkit-scrollbar{width:6px}
.plist::-webkit-scrollbar-thumb{background:#c7d3cb;border-radius:3px}
.pg{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${Ye.mute};padding:10px 6px 4px}
.pi{display:flex;align-items:center;gap:9px;height:29px;padding:0 8px;border-radius:9px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.pi:hover{background:#eef6f0}
.pi.sel{background:${Ye.accSoft};font-weight:700;color:${Ye.accDark}}
.pi span{overflow:hidden;text-overflow:ellipsis}
.pi b{flex:none;min-width:66px;font-size:11.5px;color:${Ye.accDark}}
.yr{margin:12px 0 0;font-size:46px;line-height:1;font-weight:700;color:${Ye.acc};letter-spacing:-1px}
.fl{margin:0;padding:0;list-style:none}
.fl li{position:relative;padding:3px 0 3px 16px;font-size:13.5px;color:#35403a}
.fl li:before{content:'';position:absolute;left:2px;top:11px;width:6px;height:6px;border-radius:50%;background:${Ye.acc}}
.src{font-size:10.5px;color:${Ye.mute};line-height:1.4}
.pi i{display:block;width:7px;height:7px;border-radius:50%;background:${Ye.faint};flex:none}
.pi.sel i{background:${Ye.acc}}
.pi em{margin-left:auto;font-style:normal;font-size:10px;font-weight:600;color:${Ye.orange}}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:${Ye.accDark};background:${Ye.accSoft};border-radius:8px;padding:4px 9px}
.pc h2{margin:10px 0 2px;font-size:27px;line-height:1.12;font-weight:700}
.pc .sub{margin:0 0 6px;font-size:13px;color:${Ye.mute};font-style:italic}
.pc h4{margin:18px 0 4px;font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:${Ye.accDark}}
.pc p{margin:0;font-size:14px;line-height:1.5;color:#35403a}
.chip{display:inline-block;margin:0 5px 6px 0;padding:5px 10px;border-radius:999px;background:#eef2ef;font-size:12px;font-weight:600;cursor:pointer;pointer-events:auto;transition:background .15s}
.chip:hover{background:${Ye.accSoft};color:${Ye.accDark}}
.tip{position:absolute;z-index:40;padding:5px 10px;border-radius:9px;background:${Ye.ink};color:#fff;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25);display:none}
